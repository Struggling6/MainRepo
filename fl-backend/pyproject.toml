[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-backend"
version = "0.1.0"
description = "Federated anomaly detection backend"
license = {text = "Apache-2.0"}
dependencies = [
    # NOTE: Concrete versions (incl. ROCm-tagged torch) are installed in the
    # Docker image via requirements.txt. The deps listed here only need to
    # satisfy `flwr build` packaging metadata and are intentionally permissive
    # so the project's own wheel can be installed `--no-deps` without
    # conflicting against the venv's actual installed wheels.
    "flwr[simulation]>=1.27.0",
    "torch>=2.0",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "transformers",
    "captum",
    "pypots",
    "optuna-dashboard",
]

[tool.flwr.app]
publisher = "local"
name = "fl-backend"

[tool.flwr.app.components]
clientapp = "client_app:app"
serverapp = "server_app:app"

[tool.hatch.build.targets.wheel]
packages = ["data", "models", "tasks", "training","plotting"]
include = [
  "client_app.py",
  "server_app.py",
  "FedProxWithSave.py",
  "config.py",
  "local_experiment.py",
  "main.py",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/rocm7.3"
