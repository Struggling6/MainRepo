[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-backend"
version = "0.1.0"
description = "Federated anomaly detection backend"
license = {text = "Apache-2.0"}
dependencies = [
  "flwr[simulation]==1.27.0",
  "torch==2.7.0",
  "pandas==2.2.3",
  "numpy==2.2.6",
  "scikit-learn==1.6.1",
  "matplotlib==3.10.3",
  "transformers==4.52.4",
  "captum==0.8.0",
  "optuna",
  "optuna-dashboard",
  "pypots==1.0",
  "imbalanced-learn",
]

[tool.flwr.app]
publisher = "local"
name = "fl-backend"

[tool.flwr.app.components]
clientapp = "client_app:app"
serverapp = "server_app:app"

[tool.hatch.build.targets.wheel]
packages = ["data", "models", "tasks", "training","plotting"]
include = [
  "client_app.py",
  "server_app.py",
  "FedProxWithSave.py",
  "config.py",
  "local_experiment.py",
  "main.py",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/rocm7.3"
