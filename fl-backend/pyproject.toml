[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-backend"
version = "0.1.0"
description = "Federated anomaly detection backend"
license = {text = "Apache-2.0"}
dependencies = [
    "flwr[simulation]==1.27.0",
    "torch",
    "torchvision",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "transformers",
    "captum",
]

[tool.flwr.app]
publisher = "local"
name = "fl-backend"

[tool.flwr.app.components]
clientapp = "client_app:app"
serverapp = "server_app:app"

[tool.hatch.build.targets.wheel]
packages = ["data", "models", "tasks", "training","plotting"]
include = [
  "client_app.py",
  "server_app.py",
  "FedProxWithSave.py",
  "config.py",
  "main.py",
]