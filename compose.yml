name: fl-backend

services:
  superlink:
    image: flwr/superlink:1.27.0
    command:
      - --insecure
      - --isolation
      - process
    ports:
      - "9093:9093"

  superexec-serverapp:
    image: fl-backend-app:latest
    command:
      - --insecure
      - --plugin-type
      - serverapp
      - --appio-api-address
      - superlink:9091
    depends_on:
      - superlink
    stop_signal: SIGINT

  supernode-1:
    image: flwr/supernode:1.27.0
    command:
      - --insecure
      - --superlink
      - superlink:9092
      - --clientappio-api-address
      - 0.0.0.0:9094
      - --isolation
      - process
      - --node-config
      - "partition-id=0 num-partitions=1"
    depends_on:
      - superlink

  superexec-clientapp-1:
    image: fl-backend-app:latest
    command:
      - --insecure
      - --plugin-type
      - clientapp
      - --appio-api-address
      - supernode-1:9094
    depends_on:
      - supernode-1
    stop_signal: SIGINT
    cpus: "2.0"
    mem_limit: 8g
#    devices:
#      - /dev/kfd:/dev/kfd
#      - /dev/dri:/dev/dri
#    group_add:
#      - video
#      - "988"
    volumes:
      - ./fl_backend/datasets:/app/datasets
